services:
  - type: web
    name: webforge-ai-api
    runtime: node
    plan: free
    region: oregon
    rootDir: webforge-ai
    buildCommand: npm ci
    startCommand: npm run start --workspace=server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: '24'
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: https://atuldev-v.github.io/weforgeai
      - key: JWT_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: AI_PROVIDER
        value: mock
      - key: ALLOW_BYOK
        value: 'true'
