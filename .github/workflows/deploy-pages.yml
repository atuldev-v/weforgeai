name: Deploy frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'webforge-ai/client/**'
      - 'webforge-ai/package*.json'
      - '.github/workflows/deploy-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: webforge-ai/package-lock.json

      - name: Install frontend dependencies
        run: npm ci --workspace=client
        working-directory: webforge-ai

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Warn when the API URL is missing
        if: ${{ vars.VITE_API_URL == '' }}
        run: echo "::warning::Set the repository Actions variable VITE_API_URL to the deployed API base URL ending in /api; signup and other API features will be unavailable until then."

      - name: Build frontend
        run: npm run build --workspace=client
        working-directory: webforge-ai
        env:
          GITHUB_PAGES: 'true'
          VITE_API_URL: ${{ vars.VITE_API_URL }}

      - name: Add SPA fallback and disable Jekyll processing
        run: |
          cp webforge-ai/client/dist/index.html webforge-ai/client/dist/404.html
          touch webforge-ai/client/dist/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: webforge-ai/client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
